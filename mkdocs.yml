site_name: CryptoQuantix — Docs
site_description: Bot di trading quantitativo su futures/perpetual — Deribit + dati Binance
site_author: CryptoQuantix Team
site_url: https://cryptoquantix.github.io/docs/
docs_dir: docs
# L'archivio storico non fa parte del sito (link interni superati)
exclude_docs: |
  archive/
# Pagina riservata: buildata ma NON in nav (esclusa anche da ricerca via
# front matter e dalla sitemap via publish_docs)
not_in_nav: |
  strategie-1130b67ca8af0c353cdb.md
  strategie-1130b67ca8af0c353cdb.en.md

theme:
  name: material
  language: it
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy

plugins:
  - search:
      lang: it
  # Multilingua: IT default su /docs/, EN su /docs/en/ (suffix: file.en.md).
  # Pagine senza traduzione -> fallback al contenuto italiano.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: "CryptoQuantix — Docs"
          nav_translations:
            Architettura: Architecture
            Strategie attive: Active strategies
            Configurazione (.env): Configuration (.env)
            Infrastruttura: Infrastructure
            Dati & Microstruttura: Data & Microstructure
            Esecuzione & Deployment: Execution & Deployment

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list

nav:
  - Home: index.md
  - Architettura: 01_architecture.md
  - Strategie attive: 02_strategies.md
  - Configurazione (.env): 03_configuration.md
  - Risk & Sizing: 05_risk_sizing.md
  - Infrastruttura:
      - Dati & Microstruttura: 02_data_microstructure.md
      - Orderflow & CVD: 03_orderflow_math.md
      - Backtest Engine & Monte Carlo: 06_backtest_montecarlo.md
      - Esecuzione & Deployment: 07_execution_ops.md
