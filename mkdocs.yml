site_name: CryptoQuantix — Docs
site_description: Bot di trading quantitativo su futures/perpetual — Deribit + dati Binance
site_author: CryptoQuantix Team
site_url: https://cryptoquantix.github.io/docs/
docs_dir: docs
# L'archivio storico non fa parte del sito (link interni superati)
exclude_docs: |
  archive/
# Pagina riservata: buildata ma NON in nav (esclusa anche da ricerca via
# front matter e dalla sitemap via publish_docs)
not_in_nav: |
  strategie-1130b67ca8af0c353cdb.md
  strategie-1130b67ca8af0c353cdb.en.md

theme:
  name: material
  language: it
  icon:
    logo: material/chart-line
    repo: fontawesome/brands/github
  palette:
    # Dark (default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Tema scuro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# Il click sul logo/titolo torna alla landing (non alla home dei docs)
extra:
  homepage: https://cryptoquantix.github.io
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CryptoQuantix
      name: GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/antoniotrento
      name: X / Twitter
    - icon: fontawesome/solid/envelope
      link: mailto:lantoniotrento@gmail.com
      name: Licenza commerciale

copyright: >
  © 2024-2026 Antonio Trento — Source-available, dual license:
  uso personale libero, uso commerciale su licenza

plugins:
  - search:
      lang: it
  # Multilingua: IT default su /docs/, EN su /docs/en/ (suffix: file.en.md).
  # Pagine senza traduzione -> fallback al contenuto italiano.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: "CryptoQuantix — Docs"
          nav_translations:
            Architettura: Architecture
            Strategie attive: Active strategies
            Configurazione (.env): Configuration (.env)
            Infrastruttura: Infrastructure
            Dati & Microstruttura: Data & Microstructure
            Esecuzione & Deployment: Execution & Deployment
            ⬅ Torna al sito: ⬅ Back to site

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - def_list
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Architettura: 01_architecture.md
  - Strategie attive: 02_strategies.md
  - Configurazione (.env): 03_configuration.md
  - Risk & Sizing: 05_risk_sizing.md
  - Infrastruttura:
      - Dati & Microstruttura: 02_data_microstructure.md
      - Orderflow & CVD: 03_orderflow_math.md
      - Backtest Engine & Monte Carlo: 06_backtest_montecarlo.md
      - Esecuzione & Deployment: 07_execution_ops.md
  - ⬅ Torna al sito: https://cryptoquantix.github.io
